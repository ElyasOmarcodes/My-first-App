name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
    paths-ignore:
      - ".build-outputs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Ensure release keystore (JKS)
        run: |
          # the signing key lives in keystore/hindukush-release.jks; if it is
          # ever missing, the action generates a fresh one right here
          if [ ! -f keystore/hindukush-release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v -keystore keystore/hindukush-release.jks \
              -alias hindukush -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass hindukush2026 -keypass hindukush2026 \
              -dname "CN=Hindukush Voice, O=Hindukush Voice, L=Kabul, C=AF"
          fi

      - name: Build release APK + AAB
        run: gradle :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Collect outputs
        run: |
          mkdir -p .build-outputs
          rm -f .build-outputs/app-debug.apk .build-outputs/MultiKeyboard.apk .build-outputs/HindukushKb.apk .build-outputs/HindukushKb.aab .build-outputs/PashtoKeyboardPlus.apk .build-outputs/PashtoKeyboardPlus.aab .build-outputs/KalimaKeyboard.apk .build-outputs/KalimaKeyboard.aab
          cp app/build/outputs/apk/release/app-release.apk .build-outputs/Keyflux.apk
          cp app/build/outputs/bundle/release/app-release.aab .build-outputs/Keyflux.aab

      # ---- screenshots: only when the commit message contains [shots]
      - name: Build debug APK for screenshots
        if: contains(github.event.head_commit.message, '[shots]')
        run: gradle :app:assembleDebug --no-daemon

      - name: Enable KVM for the emulator
        if: contains(github.event.head_commit.message, '[shots]')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots (light + dark)
        if: contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/shots.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyflux
          path: |
            .build-outputs/Keyflux.apk
            .build-outputs/Keyflux.aab

      - name: Commit APK back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .build-outputs
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "ci: update built APK/AAB [skip ci]"
            git push
          fi
