name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
    paths-ignore:
      - ".build-outputs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p .build-outputs
          rm -f .build-outputs/app-debug.apk
          cp app/build/outputs/apk/release/app-release.apk .build-outputs/MultiKeyboard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-keyboard-apk
          path: .build-outputs/MultiKeyboard.apk

      - name: Commit APK back to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .build-outputs
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "ci: update built APK [skip ci]"
            git push
          fi
